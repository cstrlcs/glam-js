name: Build & Test

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1.1.1

      - name: bun install
        run: bun install

      - name: Typecheck
        run: bun typecheck

      - name: Build
        run: bun run build

      - run: bun test

      - name: Smoke test the built package
        run: node --input-type=module -e "import { Vec3 } from './dist/index.js'; if (String(new Vec3(1, 2, 3).addAssign(1)) !== 'Vec3(2, 3, 4)') process.exit(1);"
